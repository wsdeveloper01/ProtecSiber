<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Threat News</title>
    <style>
        :root { --primary: #c00; --text-main: #1a1a1a; --text-muted: #666; --bg: #fff; --bg-body: #f4f4f4; --border: #e5e5e5; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-body); color: var(--text-main); line-height: 1.6; }
        .header { background: var(--bg); border-bottom: 3px solid var(--primary); padding: 15px 0; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .logo { font-size: 28px; font-weight: 800; color: var(--primary); letter-spacing: -1px; text-transform: uppercase; }
        .logo span { color: var(--text-main); }
        .date { font-size: 13px; color: var(--text-muted); }
        .nav { border-top: 1px solid var(--border); padding-top: 10px; display: flex; gap: 20px; overflow-x: auto; white-space: nowrap; }
        .nav a { color: var(--text-main); text-decoration: none; font-weight: 600; font-size: 14px; }
        .main-content { padding: 30px 0; display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        @media (max-width: 768px) { .main-content { grid-template-columns: 1fr; } }
        .artikel-card { background: var(--bg); border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .artikel-content { padding: 25px; }
        .badge { display: inline-block; background: #fee2e2; color: var(--primary); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 4px; margin-bottom: 12px; text-transform: uppercase;}
        .badge-tinggi { background: #fef2f2; color: #b91c1c; border: 1px solid #fca5a5; }
        .artikel-card h2 { font-size: 28px; margin-bottom: 15px; line-height: 1.3; }
        .artikel-card p { font-size: 15px; color: #444; margin-bottom: 20px; text-align: justify; }
        .info-pelaku { background: #f8f9fa; border-left: 4px solid var(--primary); padding: 12px 15px; margin-bottom: 20px; font-size: 14px; }
        .info-pelaku strong { color: var(--primary); }
        .himbauan-box { background: #fff3cd; border: 1px solid #ffeeba; color: #856404; padding: 15px; border-radius: 6px; margin-top: 20px; font-size: 14px;}
        .meta { font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 15px; display: flex; justify-content: space-between; margin-top: 20px;}
        .sidebar-title { font-size: 18px; font-weight: 700; border-bottom: 2px solid var(--text-main); padding-bottom: 8px; margin-bottom: 15px; }
        .sidebar-list { list-style: none; }
        .sidebar-list li { background: var(--bg); border: 1px solid var(--border); padding: 15px; border-radius: 6px; margin-bottom: 10px; }
        .sidebar-list h4 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
        .sidebar-list p { font-size: 13px; color: var(--text-muted); }
        .loading { text-align: center; padding: 50px; color: var(--text-muted); font-style: italic; }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="header-top">
                <div class="logo">CyberThreat<span>News</span></div>
                <div class="date" id="current-date"></div>
            </div>
            <div class="nav"><a href="#">Home</a><a href="#">Data Breach</a><a href="#">Cyber Attack</a><a href="#">Vulnerability</a></div>
        </div>
    </div>

    <div class="container main-content">
        <div id="berita-utama"><div class="loading">Memuat intelijen terbaru...</div></div>
        <div>
            <div class="sidebar-title">Berita Lainnya</div>
            <ul class="sidebar-list" id="berita-sidebar"></ul>
        </div>
    </div>

    <script>
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        
        // TEMBAK LANGSUNG KE BERITA.PHP
        const API_URL = 'https://obfustext.is-great.org/berita.php';

        fetch(API_URL)
            .then(res => {
                if (!res.ok) throw new Error("HTTP error " + res.status);
                return res.json();
            })
            .then(data => {
                const utama = document.getElementById('berita-utama');
                const sidebar = document.getElementById('berita-sidebar');
                if (!data.berita || data.berita.length === 0) {
                    utama.innerHTML = '<div class="loading">Belum ada berita.</div>'; return;
                }
                utama.innerHTML = ''; sidebar.innerHTML = '';
                
                data.berita.forEach((item, index) => {
                    let badge = item.tingkat_bahaya === 'Tinggi' ? 'badge-tinggi' : '';
                    if (index === 0) {
                        utama.innerHTML += `
                            <div class="artikel-card"><div class="artikel-content">
                                <span class="badge ${badge}">⚠ ${item.tingkat_bahaya} Risk</span>
                                <h2>${item.judul_berita}</h2>
                                <div class="info-pelaku"><strong>Pelaku:</strong> ${item.pelaku}</div>
                                <p>${item.isi_berita}</p>
                                <div class="himbauan-box">🚨 <strong>Himbauan:</strong> ${item.himbauan}</div>
                                <div class="meta"><span>Update: ${data.timestamp}</span><span>Sumber: ${item.sumber_forum}</span></div>
                            </div></div>`;
                    } else {
                        sidebar.innerHTML += `
                            <li><span class="badge ${badge}" style="font-size:10px;">${item.tingkat_bahaya}</span>
                            <h4>${item.judul_berita}</h4><p style="margin-bottom:5px;"><strong>Pelaku:</strong> ${item.pelaku}</p>
                            <p>${item.isi_berita.substring(0, 90)}...</p></li>`;
                    }
                });
            })
            .catch(err => {
                document.getElementById('berita-utama').innerHTML = `<div class="loading" style="color:red;">Gagal memuat data.<br><small>Error: ${err.message}</small></div>`;
            });
    </script>
</body>
</html>
